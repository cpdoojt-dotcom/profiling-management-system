<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Shield -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Headlight Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Scanning Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- The Protective Profiling Shield -->
  <path d="M256,32 L448,112 L448,352 C448,432 352,480 256,480 C160,480 64,432 64,352 L64,112 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="16" 
        stroke-linejoin="round" />

  <!-- Destination Indicator (PUV) -->
  <rect x="186" y="115" width="140" height="36" rx="8" fill="#0b0f19" stroke="#8b5cf6" stroke-width="4" />
  <text x="256" y="140" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="bold" font-size="20" text-anchor="middle" letter-spacing="3">PUV</text>

  <!-- Stylized Bus Windshield -->
  <rect x="146" y="170" width="220" height="96" rx="16" fill="url(#windshieldGrad)" stroke="#3b82f6" stroke-width="6" />
  
  <!-- Reflection on Windshield -->
  <path d="M 166 250 L 230 186" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.15" />
  <path d="M 200 250 L 280 170" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.15" />

  <!-- Bus Lower Body -->
  <path d="M136,276 C136,268 142,262 150,262 L362,262 C370,262 376,268 376,276 L376,410 C376,418 370,424 362,424 L150,424 C142,424 136,418 136,410 Z" fill="url(#bodyGrad)" />

  <!-- Left Headlight -->
  <circle cx="180" cy="350" r="22" fill="url(#lightGlow)" />
  <circle cx="180" cy="350" r="10" fill="#ffffff" />

  <!-- Right Headlight -->
  <circle cx="332" cy="350" r="22" fill="url(#lightGlow)" />
  <circle cx="332" cy="350" r="10" fill="#ffffff" />

  <!-- Center Grille -->
  <rect x="220" y="336" width="72" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
  <line x1="232" y1="351" x2="280" y2="351" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Profiling Scanner Indicator (Neon Green Scan Line) -->
  <line x1="40" y1="300" x2="472" y2="300" stroke="#10b981" stroke-width="12" stroke-linecap="round" filter="url(#glowFilter)" />
</svg>